name: cleanup-merged-branches

on:
  push:
    branches: [main]
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    if: github.event_name == 'push' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete merged work branches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          owner="${GITHUB_REPOSITORY%%/*}"

          while IFS= read -r remote; do
            [ -n "$remote" ] || continue
            branch="${remote#origin/}"

            case "$branch" in
              ci/verify-*)
                echo "Deleting obsolete verification branch: $branch"
                git push origin --delete "$branch"
                continue
                ;;
              feature/*|ci/*|docs/*) ;;
              *) continue ;;
            esac

            merged_count="$(gh api -X GET "repos/${GITHUB_REPOSITORY}/pulls" \
              -f state=closed \
              -f head="${owner}:${branch}" \
              -f per_page=100 \
              --jq '[.[] | select(.merged_at != null)] | length')"

            if [ "$merged_count" -gt 0 ]; then
              echo "Deleting merged branch: $branch"
              git push origin --delete "$branch"
            else
              echo "Keeping branch without merged PR: $branch"
            fi
          done < <(git for-each-ref --format='%(refname:short)' refs/remotes/origin/feature refs/remotes/origin/ci refs/remotes/origin/docs)
