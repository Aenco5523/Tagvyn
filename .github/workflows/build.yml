name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - id: build_info
        shell: bash
        run: |
          echo "loader=$(grep '^mod_loader=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "minecraft=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"
      - run: gradle build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Tagvyn-${{ steps.build_info.outputs.loader }}-${{ steps.build_info.outputs.minecraft }}
          path: build/libs/Tagvyn-*.jar
